name: Tests

on:
  # Uncomment when ready to enable automatic CI runs:
  # push:
  #   branches: [main, master]
  # pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib scipy PyYAML pytest jsonschema referencing

      - name: Try installing OpenModelica
        run: |
          sudo apt-get update
          sudo apt-get install -y openmodelica || true

      - name: Show OpenModelica version (if available)
        run: |
          if command -v omc >/dev/null 2>&1; then
            omc --version
          else
            echo "OpenModelica not available on this runner; tests that require omc will be skipped."
          fi

      - name: Run pytest
        run: python -m pytest tests/test_msrrv2.py -q
