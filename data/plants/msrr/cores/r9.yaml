# Segmented-only qualified steady state (physics review 2026-09-27): the
# per-cell temperatures of SegmentedMSR.Reactors.R9MSRRuhxTrimThermalSS at 1 MW, nominal
# flow, with temperature feedback referenced to the {reference_temperature}
# isothermal zero-power critical state (the lumped setpoint-table convention).
# The segmented rigs bind their FixedStart core temperatures AND their
# feedback setpoints (the tap averages of these arrays) to this block, so they
# start at the steady state with zero initial feedback. Regenerate with
#   python3.12 -m helpers.segmented_trim_levels --write
# Not read by the lumped MSRR.mo package.
segmented_steady_state:
  power:
    value: 1.0
    unit: "1"
    doc: Relative power level of the steady state (segmented runs require powerLevel = 1).
    source: helpers.segmented_trim_levels
  reference_temperature:
    value: 570.0
    unit: degC
    doc: Isothermal zero-power critical reference state; the feedback-weighted core temperature equals it at every power (lumped core/init convention).
