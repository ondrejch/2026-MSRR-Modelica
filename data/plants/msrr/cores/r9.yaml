  T_fuel:
    value: [547.0644910457, 553.8083551336, 546.0906876243, 553.9855221406, 561.7626107625, 569.7966503844, 578.6658510709, 586.1904011708, 545.0715875095, 551.3437645441, 557.5201650098, 563.9006544273, 570.9488942261, 576.9493790957, 544.0794777068, 547.4664906045, 551.5594541506, 554.9468662397]
