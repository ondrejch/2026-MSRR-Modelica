# Nine-region core. CLI --core_model 9r.
# Zone membership (plan §1): Z1={R1}; Z2={R2->R3->R4}; Z3={R5->R6->R7}; Z4={R8->R9}.
# Deposition shares kFN1/kFN2/kHT1/kHT2 were RENORMALIZED to Σ=1 on 2026-09-20
# (TASK-20260920-01 P8, rev021 finding B3): every raw MSRR.R9MSRRuhx msre9r
# value was scaled by 1/1.000649 = 0.999351420927818 (original raw sum
# 1.000649); see the kFN1 doc for the full provenance note.
# Graphite-direct share is sum(kHT1+kHT2) ~ 6.073% (the raw ~6.08% family
# scaled by the same factor) — do not force it to 1R's 7%.
# Core maturity, two axes (TASK-20260908-01 P2; split after the rev031
# review): machine-readable labels validated at load time by
# helpers/plant_config.py against owner-settable enums.
#   maturity (implementation): reference_regression | discretization_study |
#     exploratory_geometry
#   physical_data_maturity: reviewed_design_basis | legacy_inherited |
#     pending_source_review | synthetic
maturity: reference_regression
physical_data_maturity: legacy_inherited
