  source: "Structured provenance in the provenance block below (INL/EXT-16-38241 Rev. 1, McEligot et al. 2017, G-348 measured k(T) correlation evaluated at 570 degC); first cut 2026-09-06, owner-approved (TASK-20260906-02 decision 6)."
  provenance:
    kind: correlation
    report: INL/EXT-16-38241 Rev. 1
    authors: McEligot et al.
    year: 2017
    material_grade: G-348
    grade_confirmed: false
    grade_caveat: "The MSR-1 graphite grade is unconfirmed: the MSR-1/ACU MSRR PSAR (NRC ML22227A203, 611 pp, full-text scanned) publishes no graphite thermal conductivity and no graphite grade, so the G-348 reactor-grade fine-grain isotropic graphite correlation is a first-cut surrogate; grade confirmation is a follow-up card."
    valid_range_degC: [20, 1000]
    uncertainty_frac: 0.03
    uncertainty_note: "Measured correlation, stated ~3% uncertainty."
    correlation:
      form: "k(T) = c0 + c1*T + c2*T^2, T in degC, k in W/(m.K)"
      coefficient_units: "c0: W/(m.K); c1: W/(m.K)/degC; c2: W/(m.K)/degC^2"
      c0: 136.0
      c1: -0.1092
      c2: 3.772e-5
    evaluation_temperature_degC: 570
    evaluation_temperature_note: "Representative graphite temperature (TG setpoint; paper linearization band 550-650 degC)."
    result_unrounded: 86.011228
    result_rounded: 86.0
    rounding_step: 0.1
    rounding_note: "k_mod stores the correlation result rounded to the nearest rounding_step W/(m.K); result_unrounded records the raw evaluation."
# Lattice metadata for the SegmentedMSR bind. These do NOT currently
# set inventories; cell_vol and vol_graphite do.
channel_map:
  pitch_type: Triangular
  pitch:
    value: 0.266824916475
    unit: m
    doc: EFFECTIVE lattice pitch (staggered triangular) derived from the core inventory (physics review 2026-09-27; replaces the 0.02 m placeholder inherited from r1). Each of the 25 model channels lumps several physical channels, so its lattice cell must hold that channel's graphite and salt over the modeled height H = nSeg*dz = 1.4 m - cellA = (vol_graphite/25 + sum_j cell_vol[c,j])/H = (0.07032 + 0.016)/1.4 m2 = (sqrt(3)/2)*p^2. With chanR below, the moderator axial-conduction section map.modAnnulusArea = cellA - pi*chanR^2 = vol_graphite/(25*H) = 0.0502286 m2, consistent with the moderator heat capacity (the 0.02 m placeholder gave 1.4535e-4 m2, ~346x too small, so K_mod = 86 carried almost no axial conduction). G_ck = K_mod*dz/sqrt(3) stays pitch-independent.
  dz:
    value: 0.14
    unit: m
    doc: Axial pitch per segment (10 x 0.14 m = 1.4 m, as r1_10seg). Does not control heat capacity.
