# 5x5 radial (25-channel, staggered triangular pitch) x 10-axial-segment
# core. CLI --core_model r5x5_z10 (TASK-20260906-02; first cut 2026-09-06).
# FIRST CUT: uniform 25-channel x 10-segment partition of the r1 lumped
# totals (9R zone-partition precedent: per-channel/per-segment shares sum
# to the plant totals). No measured radial power/flow profile exists in
# the repository; refinement from measured data is a follow-up.
# Coarsening anchor: the 25 identical 1/25 channels sharing one loop
# reproduce the r1_10seg 1-channel x 10-segment core (per-channel sums =
# the 1r10seg data: cellVol 0.04 m3, qFiss 0.093, qMod 0.007, kHT 0.1 per
# segment; flow 1.0; hAnom 4565 W/K). The 25 channels are exact radial
# replicas of one another under the uniform first-cut forcing: each carries
# 1/25 of the flow and heat, and the 25-column sums reproduce the r1_10seg
# data exactly (static partition sums are exact). In the 25-fold symmetric
# state every radial neighbor delta-T is zero, so the radial conduction
# fluxes vanish; the radial zero-flux argument is exact. K_mod = 86.0
# W/(m.K) is the first non-zero product binding (decision 6, owner-approved
# 2026-09-06). Axial graphite conduction remains active in the 5x5 model
# (the product r1_10seg core sets K_mod = 0). On the inventory-consistent
# effective lattice (physics review 2026-09-27; G_ax ~ 30.85 W/K per axial
# link, the former 0.02 m placeholder gave ~0.09 W/K) it produces real
# steady-state offsets against the 10-segment reference: the outlet
# graphite tap sits lower by about 2.09 K on the PSAR-basis data (about
# 0.511 K before TASK-20261001-01; the placeholder lattice gave about
# 1.9e-3 K) and the segment-5 means sit higher by about 0.04-0.09 K, so dynamic
# agreement between the 5x5 and r1_10seg models is tolerance-based, not
# identity-based. The coarsening anchor is scoped
# accordingly: the trajectory coincides for every quantity unaffected by
# the added axial graphite conduction; the outlet-graphite tap differs by
# the documented tolerance-based offset. The coarsening QA check itself
# compares against a reference core with the matched summed axial
# conductance, so it is an exact identity (TASK-20261001-01).
# Core maturity, two axes (TASK-20260908-01 P2; split after the rev031
# review): machine-readable labels validated at load time by
# helpers/plant_config.py against owner-settable enums.
#   maturity (implementation): reference_regression | discretization_study |
#     exploratory_geometry
#   physical_data_maturity: reviewed_design_basis | legacy_inherited |
#     pending_source_review | synthetic
