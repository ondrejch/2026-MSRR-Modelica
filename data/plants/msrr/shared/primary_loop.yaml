# Primary salt loop. Named volume order is the connect sequence
# core -> pipeCoreToDHRS -> DHRS -> pipeDHRStoHX -> HX primary -> pipeHXtoCore.
# Sum of the five volumes is 0.1000004 m3 (plan quotes 0.100).
vdot_fuel:
  value: 0.0091923
  unit: m3/s
  doc: Nominal primary volumetric flow at pump FF = 1 (= mdot/rho_fuel; keep consistent with materials.fuel.rho).
  source: "PSAR fuel mass flow 23.9 kg/s (ACU MSRR PSAR Rev. 0, Sec. 1.2.3.4) / 2600 kg/m3; TASK-20261001-01. Formerly 0.011493 m3/s (23.9 kg/s at 2079.45 kg/m3)."
volumes:
  pipeCoreToDHRS:
    value: 2.4369e-3
    unit: m3
    doc: Pipe from core outlet to DHRS.
    source: MSRR.R1MSRRuhx pipeCoreToDHRS.vol / SegmentedMSR.Reactors.volLoop1R[1]
  DHRS:
    value: 0.04
    unit: m3
    doc: Drain-heat-removal-system salt volume.
    source: MSRR.R1MSRRuhx dhrs.vol / SegmentedMSR.Reactors.volLoop1R[2]
  pipeDHRStoHX:
    value: 4.8738e-3
    unit: m3
    doc: Pipe from DHRS to intermediate HX primary inlet.
    source: MSRR.R1MSRRuhx pipeDHRStoHX.vol / SegmentedMSR.Reactors.volLoop1R[3]
  HXprimary:
    value: 0.045379
    unit: m3
    doc: Intermediate HX primary-side salt volume (also heatExchanger.vol_P).
    source: MSRR.R1MSRRuhx heatExchanger.vol_P / SegmentedMSR.Reactors.volLoop1R[4]
  pipeHXtoCore:
    value: 7.3107e-3
    unit: m3
    doc: Pipe from HX primary outlet back to core inlet.
    source: MSRR.R1MSRRuhx pipeHXtoCore.vol / SegmentedMSR.Reactors.volLoop1R[5]
pipes:
  pipeCoreToDHRS:
    volFracNode:
