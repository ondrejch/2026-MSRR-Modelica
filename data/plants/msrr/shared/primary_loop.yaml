dhrs:
  tK:
    value: 10.0
    unit: s
    doc: DHRS actuation time constant.
    source: MSRR.R1MSRRuhx dhrs.DHRS_tK
  max_remove:
    value: 320000.0
    unit: W
    doc: DHRS maximum heat-removal rate.
    source: MSRR.R1MSRRuhx dhrs.DHRS_MaxP_Rm
  bleed:
    value: 0.0
