doc: 'Exploratory intra-channel radial demo scenario (TASK-20260914-01 P7; plan
  §12 Phase G, §14 ladder). Runs the committed SYNTHETIC demo vehicle SegmentedMSR.Demos.R1MSRRuhx10SegRadialCirculatingHX
  - an extension of the production 1r10seg full-loop rig with the optional fuel
  -> pipe -> annular fluid -> moderator stack ENABLED with PRESCRIBED ANNULAR CIRCULATION
  and the dedicated finite-conductance annular heat exchanger onto a prescribed
  sink (plan §14 LADDER CASE 3). Every number in the vehicle''s radial record is
  a SYNTHETIC PLACEHOLDER with no physical provenance; this is a TRANSPORT/CONSERVATION
  demonstration run, NOT a plant prediction. Geometry policy EFFECTIVE_THERMAL
  (review rev019 Phase 2; TASK-20260915-01 P2): each modeled coarse channel binds
  ONE synthetic literal tube (channelMultiplicity N_c = 1) over the REAL per-segment
  fuel length 0.1575 m (not the moderator center spacing dz = 0.14 m). The effective
  geometry does NOT close: the computed fuel volume pi*(0.012 m)^2*0.1575 m = 7.1e-5
  m3 per segment is about a factor of 561 BELOW the declared 0.04 m3 per-segment
  salt inventory, and the 0.020 m annulus outer radius exceeds the 0.020 m lattice
  pitch (cell inradius 0.010 m; diameter 0.040 m cannot fit). Both discrepancies
  are disclosed here
  and in the vehicle docstring; strict_physical is therefore NOT claimable by this
  deck. Maturity: exploratory_geometry. This deck is deliberately OUTSIDE the existing
  1r/1r10seg/9r/r5x5_z10 campaign tables (no automatic activation); the production
  vehicles stay disabled. All temperatures are kelvin. Run with: python3.12 -m
  helpers.run_radial_demo --scenario radial_1r10seg_circulating_cooled'
