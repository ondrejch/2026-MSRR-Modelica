schema_version: 1
kind: frequency
id: nominal_sweep
doc: Developer CLI defaults of freq.runFreqNominalParallel (not the paper campaign).
applies_to: [msrr.r1, msrr.r9, msrr.r1_10seg, msrr.r5x5_z10]
package_support:
  legacy:
    vehicle_by_core:
      r1: MSRR.MSRRuhxNominalTrimNoTrips
      r9: MSRR.MSRRuhxNominalTrim9RNoTrips
  segmented:
    base_vehicle: trim_rig
    power_mw_required: 1.0
grid:
  omega_min: 0.01
  omega_max: 10.0
  n: 100
  spacing: log
  unit: rad/s
forcing:
  ss_time_s: 2000.0
  sin_mag_pcm: 1.0
  sin_mag_mode: fixed
numerics:
  stop_time_s: 10000.0
  stop_time_mode: fixed
  output_interval_mode: fixed_rate
  output_intervals_per_second: 10.0
  method: dassl
  tolerance: 1.0e-6
low_power_protocol:
  threshold_mw: 0.01
  ss_factor: 400.0
  nfloor: 1.0e-9
  min_cycles_after_ss: 12.0
